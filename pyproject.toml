[project]
name = "carcase-ai-moderation-mlprod"
version = "0.1.0"
description = "LLM-based moderation service for CARCASE ARENA squads UGC."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "flake8>=7.0.0",
    "httpx>=0.27.0",
    "isort>=5.13.0",
    "mypy>=1.10.0",
    "pylint>=3.2.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
addopts = "--cov=carcase_ai_moderation --cov-report=term-missing:skip-covered"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["carcase_ai_moderation"]

[tool.coverage.report]
fail_under = 70
show_missing = true
