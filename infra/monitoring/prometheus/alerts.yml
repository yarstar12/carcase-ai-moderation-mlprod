groups:
  - name: moderation-service
    rules:
      - alert: ModerationServiceDown
        expr: up{job="moderation-service"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Moderation service is down"
          description: "Prometheus cannot scrape /metrics from moderation-service for 2 minutes."

      - alert: ModerationHighLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(moderation_request_latency_seconds_bucket[5m])) by (le)
          ) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on moderation requests"
          description: "p95 latency is > 0.5s for 10 minutes."

      - alert: ModerationNoTraffic
        expr: sum(rate(moderation_requests_total[15m])) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No moderation traffic"
          description: "No requests observed for 30 minutes."

      - alert: ModerationHighReviewRate
        expr: |
          (
            sum(rate(moderation_requests_total{decision="review"}[10m]))
            /
            sum(rate(moderation_requests_total[10m]))
          ) > 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "High review rate"
          description: "More than 50% of requests go to review for 15 minutes."

      - alert: ModerationValidationMetricsMissing
        expr: absent(moderation_validation_precision_block{dataset_kind="smoke"})
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Validation metrics missing"
          description: "No validation (smoke) metrics are present in Prometheus. Check Airflow DAG and Pushgateway."

      - alert: ModerationValidationPrecisionLow
        expr: moderation_validation_precision_block{dataset_kind="smoke"} < 0.90
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "Low BLOCK precision on validation set"
          description: "Validation precision for BLOCK decision is below 0.90 (smoke set)."

      - alert: ModerationValidationCriticalFNRise
        expr: moderation_validation_critical_fn_rate{dataset_kind="smoke"} > 0.01
        for: 2h
        labels:
          severity: critical
        annotations:
          summary: "Critical false negatives on validation set"
          description: "Share of expected BLOCK predicted as ALLOW is above 1% (smoke set)."
